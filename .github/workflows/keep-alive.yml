name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes during active hours (6AM–11PM IST = 0:30–17:30 UTC)
    # This saves ~55% of GitHub Actions minutes vs running 24/7
    - cron: '*/14 1-17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: curl -fsS https://tfi-backend-3n2s.onrender.com/api/health || true
